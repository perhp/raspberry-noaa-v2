---
- name: remove old scheduling cron job
  cron:
    disabled: yes
    name: schedule passes
    minute: 1
    hour: 0
    job: "{{ noaa_home }}/scripts/schedule.sh"

- name: create scheduling cron job
  cron:
    name: schedule passes daily
    minute: 1
    hour: 0
    job: "{{ noaa_home }}/scripts/schedule.sh -t"

- name: create scheduling cron job @ reboot
  cron:
    name: schedule passes after reboot
    special_time: reboot
    job: "{{ noaa_home }}/scripts/schedule.sh"

- name: Set permissions on scratch_perms.sh
  file:
    path: "/home/{{ target_user }}/raspberry-noaa-v2/scripts/tools/scratch_perms.sh"
    state: file
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0755

- name: Set permissions on verification.sh
  file:
    path: "/home/{{ target_user }}/raspberry-noaa-v2/scripts/tools/verification_tool/verification.sh"
    state: file
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0755

- name: Set permissions on build_permissions_list.sh
  file:
    path: "/home/{{ target_user }}/raspberry-noaa-v2/scripts/tools/verification_tool/config/build_permissions_list.sh"
    state: file
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0755

- name: create Scratch Perm fix cron job @ reboot
  cron:
    name: Correct /run/user/uid perms after reboot
    special_time: reboot
    job: "{{ noaa_home }}/scripts/tools/scratch_perms.sh"

# the watchdog itself no-ops unless enable_health_watchdog is true, so the
# cron entry can be installed unconditionally
- name: create health watchdog cron job
  cron:
    name: station health watchdog
    minute: 30
    job: "{{ noaa_home }}/scripts/tools/health_watchdog.sh"

- name: create sky quality map cron job
  cron:
    name: regenerate reception quality sky map
    minute: 40
    hour: 0
    job: "{{ noaa_home }}/scripts/tools/sky_quality_map.sh"

- name: create database
  shell: "/usr/bin/sqlite3 {{ noaa_home }}/db/panel.db < {{ noaa_home }}/db_migrations/00_seed_schema.sql"
  args:
    executable: /bin/bash
    creates: "{{ noaa_home }}/db/panel.db"

- name: create images directory
  become: yes
  file:
    path: "{{ images_output }}"
    state: directory
    owner: "{{ target_user }}"
    mode: 0775

- name: create thumbnails directory
  become: yes
  file:
    path: "{{ images_output }}/thumb"
    state: directory
    owner: "{{ target_user }}"
    mode: 0775

- name: create audio root directory
  become: yes
  file:
    path: "{{ audio_output }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0775

- name: create noaa audio directory
  become: yes
  file:
    path: "{{ audio_output }}/noaa"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0775

- name: create meteor audio directory
  become: yes
  file:
    path: "{{ audio_output }}/meteor"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0775
...
