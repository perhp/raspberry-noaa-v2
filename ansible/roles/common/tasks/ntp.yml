---
# Trixie dropped the transitional 'ntp' package name, so ntpsec is installed
# directly and uses its own config location and driftfile path
- name: install ntpsec
  become: yes
  apt:
    update_cache: no
    state: present
    name: ntpsec

- name: Check if systemd-timesyncd service exists
  become: yes
  command: systemctl status systemd-timesyncd
  failed_when: false
  changed_when: false
  register: timesyncd_status

- name: Stop and disable systemd-timesyncd if it exists
  become: yes
  service:
    name: systemd-timesyncd
    state: stopped
    enabled: no
  when: timesyncd_status.rc != 4 and timesyncd_status.rc != 5      #Return code 4 means service unknown, 5 means service not found

- name: ntpsec config file
  become: yes
  template:
    src: ntp.conf.j2
    dest: /etc/ntpsec/ntp.conf
    owner: root
    group: root
    mode: 0644
  vars:
    ntp_driftfile: /var/lib/ntpsec/ntp.drift
  notify: restart ntpsec
...
