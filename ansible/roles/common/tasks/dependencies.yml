---
- name: Installing general dependencies (this task can take a while when installing for the first time, your Raspberry Pi / PC isn't frozen)
  become: yes
  apt:
    update_cache: yes
    state: present
    name:
      - airspy
      - at
      - bc
      - build-essential
      - certbot
      - cmake
      - curl
      - git
      - hackrf
      - imagemagick
      - jq
      - libusb-1.0-0
      - libusb-1.0-0-dev
      - pkg-config
      - python3-ephem
      - python3-jsonschema
      - python3-matplotlib
      - python3-numpy
      - python3-pip
      - python3-requests
      - python3-venv
      - python3-yaml
      - sox
      - sqlite3
      - wget

# The RN2 virtualenv is created with system site-packages so the apt-installed
# Python modules (numpy, matplotlib, ephem, ...) remain importable. Runtime
# scripts use it through the PYTHON variable rendered into ~/.noaa-v2.conf.
# It holds no packages by default - push-processor libraries (tweepy,
# facebook-sdk, ...) are added to it by social_media.yml when their push
# option is enabled.
- name: Create the RN2 virtualenv
  command: /usr/bin/python3 -m venv --system-site-packages /home/{{ target_user }}/.rn2_venv
  args:
    creates: /home/{{ target_user }}/.rn2_venv/bin/python3

# SatDump ships no Trixie package upstream, so it is built from source against
# the distro's volk 3.x / nng 1.10
- name: Install SatDump build dependencies
  become: yes
  apt:
    update_cache: no
    state: present
    name:
      - g++
      - pkgconf
      - libfftw3-dev
      - libpng-dev
      - libtiff-dev
      - libjemalloc-dev
      - libcurl4-openssl-dev
      - libvolk-dev
      - libnng-dev
      - libzstd-dev
      - libomp-dev
      - libglfw3-dev
      - libgles-dev
      - libegl-dev
      - portaudio19-dev
      - libhdf5-dev
      - librtlsdr-dev
      - libhackrf-dev
      - libairspy-dev
      - libairspyhf-dev
      - ocl-icd-opencl-dev

- name: Check if SatDump is already installed
  stat:
    path: /usr/bin/satdump
  register: satdump_bin

- name: Clone SatDump sources
  git:
    repo: https://github.com/SatDump/SatDump.git
    dest: /tmp/satdump
    version: "1.2.2"
    depth: 1
  when: not satdump_bin.stat.exists

- name: Create SatDump build directory
  file:
    path: /tmp/satdump/build
    state: directory
    mode: 0755
  when: not satdump_bin.stat.exists

- name: Generate SatDump build system
  command: cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr ..
  args:
    chdir: /tmp/satdump/build
    creates: /tmp/satdump/build/Makefile
  when: not satdump_bin.stat.exists

# -j2 rather than nproc: satdump's C++ compile units are memory-hungry and
# 4 parallel jobs can OOM a 4GB Raspberry Pi
- name: Build SatDump - this takes a long time on a Raspberry Pi
  command: make -j2
  args:
    chdir: /tmp/satdump/build
  when: not satdump_bin.stat.exists

- name: Install SatDump
  become: yes
  command: make install
  args:
    chdir: /tmp/satdump/build
    creates: /usr/bin/satdump
  when: not satdump_bin.stat.exists

# OS Lite versions do not have .config, but when it is created by the SatDump
# config task the ownership of the top directory ends up root:root - it needs
# to be target_user:target_user 700
- name: .config directory ownership
  become: yes
  file:
    path: /home/{{ target_user }}/.config
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: 0700
...
