  apt:
    update_cache: yes
    state: present
    name:
      - python3-pip
      - wget
      - curl
      - build-essential
      - at
      - bc
      - cmake
      - ffmpeg
      - gmic
      - airspy
      - hackrf
      - imagemagick
      - jq
      - libgles-dev
      - libegl-dev
      - libopenblas-dev
      - libgfortran5
      - libjpeg-dev
      - libtiff-dev
      - libsox-fmt-mp3
      - libusb-1.0-0
      - libusb-1.0-0-dev
      - libxft-dev
      - libxft2
      - python3-setuptools
      - python3-venv
      - python3-idna
      - python3-jsonschema
      - python3-matplotlib
      - python3-numpy
      - python3-pil # this is really pillow
      - python3-yaml
      - python3-requests
      - python3-urllib3
      - python3-ephem
      - socat
      - sox
      - sqlite3
      - certbot
      - zlib1g-dev
      - libsqlite3-dev
      - python3-dev
      - cmake
      - build-essential
      - pkg-config
      - git
      - liblapacke-dev
      - gfortran
      - libopencv-dev
      - python3-opencv

# Package names that differ between Debian releases:
# - wkhtmltopdf was removed from Debian Trixie (QtWebKit is gone); the email
#   schedule image in scripts/schedule.sh degrades gracefully when it's missing
# - libvolk2-dev (Bookworm) became libvolk-dev (Trixie)
# - libncurses5-dev/libncursesw5-dev transitional packages were dropped in
#   Trixie in favor of libncurses-dev
# - libatlas-base-dev (ATLAS) was removed from Trixie; libopenblas-dev in the
#   general list covers BLAS/LAPACK there
- name: Installing version-specific dependencies (up to bookworm)
  become: yes
  apt:
    update_cache: no
    state: present
    name:
      - wkhtmltopdf
      - libvolk2-dev
      - libncurses5-dev
      - libncursesw5-dev
      - libatlas-base-dev
  when: raspbian_version.stdout != 'trixie'

- name: Installing version-specific dependencies (trixie)
  become: yes
  apt:
    update_cache: no
    state: present
    name:
      - libvolk-dev
      - libncurses-dev
  when: raspbian_version.stdout == 'trixie'

