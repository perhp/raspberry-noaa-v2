# The RN2 virtualenv is created with system site-packages so the apt-installed
# Python modules (numpy, matplotlib, ephem, ...) remain importable; only the
# packages unavailable via apt are pip-installed into it. Runtime scripts use
# it through the PYTHON variable rendered into ~/.noaa-v2.conf.
# (pysqlite3 was dropped from this list: nothing in the repo imports it - the
# Python scripts use the stdlib sqlite3 module - and 0.5.1 no longer compiles
# against Python 3.13 on Trixie)
- name: Install pip-only Python packages into the RN2 virtualenv
  pip:
    name:
      - envbash==1.2.0
      - facebook-sdk==3.1.0
    state: present
    virtualenv: /home/{{ target_user }}/.rn2_venv
    virtualenv_command: /usr/bin/python3 -m venv --system-site-packages

# SatDump .deb packages are only provided for 64-bit Bookworm (arm64/amd64).
# Upstream ships no Trixie package, so on Trixie SatDump is built from source
# against the distro's volk 3.x / nng 1.10 below.
- name: Installing SatDump
  become: yes
  apt:
    deb: "{{ noaa_home }}/software/satdump_1.2.2_bookworm_{{ system_architecture }}.deb"
    state: present
    update_cache: no
  when: raspbian_version.stdout != 'trixie'

- name: Install SatDump build dependencies (trixie)
  become: yes
  apt:
    update_cache: no
    state: present
    name:
      - git
      - build-essential
      - cmake
      - g++
      - pkgconf
      - libfftw3-dev
      - libpng-dev
      - libtiff-dev
      - libjemalloc-dev
      - libcurl4-openssl-dev
      - libvolk-dev
      - libnng-dev
      - libzstd-dev
      - libomp-dev
      - libglfw3-dev
      - portaudio19-dev
      - libhdf5-dev
      - librtlsdr-dev
      - libhackrf-dev
      - libairspy-dev
      - libairspyhf-dev
      - ocl-icd-opencl-dev
  when: raspbian_version.stdout == 'trixie'

- name: Check if SatDump is already installed (trixie)
  stat:
    path: /usr/bin/satdump
  register: satdump_bin
  when: raspbian_version.stdout == 'trixie'

- name: Clone SatDump sources (trixie)
  git:
    repo: https://github.com/SatDump/SatDump.git
    dest: /tmp/satdump
    version: "1.2.2"
    depth: 1
  when: raspbian_version.stdout == 'trixie' and not satdump_bin.stat.exists

- name: Create SatDump build directory (trixie)
  file:
    path: /tmp/satdump/build
    state: directory
    mode: 0755
  when: raspbian_version.stdout == 'trixie' and not satdump_bin.stat.exists

- name: Generate SatDump build system (trixie)
  command: cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr ..
  args:
    chdir: /tmp/satdump/build
    creates: /tmp/satdump/build/Makefile
  when: raspbian_version.stdout == 'trixie' and not satdump_bin.stat.exists

# -j2 rather than nproc: satdump's C++ compile units are memory-hungry and
# 4 parallel jobs can OOM a 4GB Raspberry Pi
- name: Build SatDump - this takes a long time on a Raspberry Pi (trixie)
  command: make -j2
  args:
    chdir: /tmp/satdump/build
  when: raspbian_version.stdout == 'trixie' and not satdump_bin.stat.exists

- name: Install SatDump (trixie)
  become: yes
  command: make install
  args:
    chdir: /tmp/satdump/build
    creates: /usr/bin/satdump
  when: raspbian_version.stdout == 'trixie' and not satdump_bin.stat.exists

